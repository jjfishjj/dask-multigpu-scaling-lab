name: Dask multi-GPU benchmark
on: {workflow_dispatch: {}}
jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: nvidia-smi
      - run: docker build -t nvidia-lab/dask .
      - run: docker run --rm --gpus all --ipc=host --ulimit memlock=-1:-1 nvidia-lab/dask --elements 100000000 | tee dask-result.json
      - uses: actions/upload-artifact@v4
        with: {name: dask-result, path: dask-result.json}
